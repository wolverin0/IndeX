name: Update data

# Rebuilds data/snapshot.json from the INDEC API and commits it to main.
# Vercel deploys every push to main, so a new commit here publishes the site.
# The INDEC token only lives in this job (repository secret INDEC_TOKEN);
# the published site never sees it.

on:
  schedule:
    # INDEC publishes at 16:00 Buenos Aires time (19:00 UTC); refresh after that.
    - cron: '41 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build data snapshot
        env:
          # Optional. Without it the build uses the public datos.gob.ar copy.
          INDEC_TOKEN: ${{ secrets.INDEC_TOKEN }}
        run: node scripts/build-data.mjs

      - name: Commit refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshot.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Actualizar datos $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
